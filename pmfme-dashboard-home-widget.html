<!-- PMFME Gujarat official dashboard widget: synchronized from data/pmfme-gujarat-dashboard.json -->
<section id="pmfme-official-dashboard" class="pmfme-home-dashboard">
<style>
.pmfme-home-dashboard{background:linear-gradient(180deg,#f4fafd,#eef7fa);padding:58px 0;border-top:1px solid #d8e9f0;border-bottom:1px solid #d8e9f0}
.pmfme-home-dashboard .phd-wrap{width:min(1160px,92%);margin:auto}
.pmfme-home-dashboard .phd-head{text-align:center;max-width:820px;margin:0 auto 28px}
.pmfme-home-dashboard .phd-eyebrow{display:inline-block;color:#1d6f9f;font-size:12px;letter-spacing:1.8px;font-weight:900}
.pmfme-home-dashboard h2{font-size:clamp(30px,4vw,42px);line-height:1.12;color:#123f63;margin:7px 0 10px}
.pmfme-home-dashboard .phd-head p{color:#5d7485;font-size:14px;margin:0}
.pmfme-home-dashboard .phd-meta{margin-top:9px;font-size:11px;color:#718898}
.pmfme-home-dashboard .phd-meta a{color:#1d6f9f;text-decoration:underline}
.pmfme-home-dashboard .phd-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pmfme-home-dashboard .phd-card{color:#fff;border-radius:18px;padding:21px;min-height:160px;box-shadow:0 10px 28px rgba(18,63,99,.10)}
.pmfme-home-dashboard .phd-card:nth-child(1){background:#45a3e9}.pmfme-home-dashboard .phd-card:nth-child(2){background:#2ebed0}.pmfme-home-dashboard .phd-card:nth-child(3){background:#2b9b93}.pmfme-home-dashboard .phd-card:nth-child(4){background:#f3a43b}.pmfme-home-dashboard .phd-card:nth-child(5){background:#96796e}.pmfme-home-dashboard .phd-card:nth-child(6){background:#596cc0}
.pmfme-home-dashboard .phd-card h3{font-size:17px;margin:0 0 8px}.pmfme-home-dashboard .phd-total{font-size:29px;font-weight:900;margin-bottom:9px}.pmfme-home-dashboard .phd-years{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:11px}.pmfme-home-dashboard .phd-years span{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.18);padding:2px 0}
.pmfme-home-dashboard .phd-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;margin-top:15px}
.pmfme-home-dashboard .phd-panel{background:#fff;border:1px solid #d7e6ee;border-radius:17px;padding:20px;box-shadow:0 8px 22px rgba(18,63,99,.06)}
.pmfme-home-dashboard .phd-panel h3{color:#123f63;font-size:19px;margin:0 0 13px}.pmfme-home-dashboard .phd-barrow{margin:9px 0}.pmfme-home-dashboard .phd-barlabel{display:flex;justify-content:space-between;font-size:11px;color:#526d7c;margin-bottom:4px}.pmfme-home-dashboard .phd-bar{height:17px;background:#edf3f6;border-radius:5px;overflow:hidden}.pmfme-home-dashboard .phd-bar i{display:block;height:100%;background:#315a78;border-radius:5px}
.pmfme-home-dashboard .phd-cats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.pmfme-home-dashboard .phd-cat{padding:13px;border-radius:12px;background:#eef7f8;text-align:center}.pmfme-home-dashboard .phd-cat b{display:block;font-size:20px;color:#123f63}.pmfme-home-dashboard .phd-cat span{font-size:11px;color:#5d7485}
.pmfme-home-dashboard .phd-sanction{margin-top:15px}
.pmfme-home-dashboard .phd-tops{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:15px}.pmfme-home-dashboard .phd-top{border-radius:17px;padding:19px;color:#fff}.pmfme-home-dashboard .phd-top:nth-child(1){background:#28a89b}.pmfme-home-dashboard .phd-top:nth-child(2){background:#ad46c1}.pmfme-home-dashboard .phd-top:nth-child(3){background:#7f949f}.pmfme-home-dashboard .phd-top h3{font-size:17px;margin:0 0 9px}.pmfme-home-dashboard .phd-rank{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.22);font-size:12px}.pmfme-home-dashboard .phd-rank:last-child{border-bottom:0}
.pmfme-home-dashboard .phd-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}.pmfme-home-dashboard .phd-note{font-size:11px;color:#687f8d}.pmfme-home-dashboard .phd-btn{display:inline-flex;align-items:center;justify-content:center;background:#1d6f9f;color:#fff;border-radius:999px;padding:11px 17px;font-size:12px;font-weight:800;text-decoration:none}.pmfme-home-dashboard .phd-loading{text-align:center;color:#607989;padding:25px}
@media(max-width:850px){.pmfme-home-dashboard .phd-metrics,.pmfme-home-dashboard .phd-grid,.pmfme-home-dashboard .phd-tops{grid-template-columns:1fr}.pmfme-home-dashboard .phd-years{grid-template-columns:1fr}}
</style>
<div class="phd-wrap">
<div class="phd-head"><span class="phd-eyebrow">OFFICIAL PMFME GUJARAT DATA</span><h2>PMFME Gujarat Dashboard</h2><p>Key information displayed on the official PMFME Gujarat state dashboard, synchronized periodically from the Ministry of Food Processing Industries source.</p><div class="phd-meta" id="phd-meta">Loading synchronized data…</div></div>
<div id="phd-content" class="phd-loading">Loading dashboard data…</div>
</div>
<script>
(()=>{const root=document.getElementById('pmfme-official-dashboard');if(!root)return;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=x=>Number(x||0).toLocaleString('en-IN');const metric=(title,key,d)=>{const rows=d.yearly[key]||[];return `<article class="phd-card"><h3>${esc(title)}</h3><div class="phd-total">${n(d.totals[key])}</div><div class="phd-years">${rows.map(r=>`<span><b>${esc(r.year)}</b><b>${n(r.value)}</b></span>`).join('')}</div></article>`};const tops=(title,rows)=>`<article class="phd-top"><h3>${esc(title)}</h3>${rows.map(r=>`<div class="phd-rank"><span>${esc(r.name)}</span><b>${n(r.value)}</b></div>`).join('')}</article>`;fetch('/data/pmfme-gujarat-dashboard.json?ts='+Date.now()).then(r=>r.json()).then(d=>{const a=d.lastSevenDays.applicationsSubmitted||[],s=d.lastSevenDays.applicationsSanctioned||[],max=Math.max(...a.map(x=>x.value),1),maxS=Math.max(...s.map(x=>x.value),1);document.getElementById('phd-meta').innerHTML=`Last synchronized: <b>${esc(new Date(d.syncedAt).toLocaleString('en-IN'))}</b> · <a href="${esc(d.sourceUrl)}" target="_blank" rel="noopener">Official source</a>`;document.getElementById('phd-content').outerHTML=`<div id="phd-content"><div class="phd-metrics">${metric('Applications Submitted','applicationsSubmitted',d)}${metric('Loan Sanctioned','loanSanctioned',d)}${metric('Loan Disbursed','loanDisbursed',d)}${metric('Applications Forwarded To Bank','applicationsForwardedToBank',d)}${metric('ODOP Applications','odopApplications',d)}${metric('Non ODOP Applications','nonOdopApplications',d)}</div><div class="phd-grid"><section class="phd-panel"><h3>Applications submitted in last seven days</h3>${a.map(x=>`<div class="phd-barrow"><div class="phd-barlabel"><span>${esc(x.date)}</span><b>${n(x.value)}</b></div><div class="phd-bar"><i style="width:${x.value/max*100}%"></i></div></div>`).join('')}</section><section class="phd-panel"><h3>Social Category wise No of Application</h3><div class="phd-cats">${Object.entries(d.socialCategory||{}).map(([k,v])=>`<div class="phd-cat"><b>${v}%</b><span>${esc(k)}</span></div>`).join('')}</div><div class="phd-sanction"><h3>Applications sanctioned in last seven days</h3>${s.map(x=>`<div class="phd-barrow"><div class="phd-barlabel"><span>${esc(x.date)}</span><b>${n(x.value)}</b></div><div class="phd-bar"><i style="width:${x.value/maxS*100}%"></i></div></div>`).join('')}</div></section></div><div class="phd-tops">${tops('Top 5 Performing DLCs',d.topPerformers.dlcs||[])}${tops('Top 5 Performing Districts',d.topPerformers.districts||[])}${tops('Top 5 Performing DRPs',d.topPerformers.drps||[])}</div><div class="phd-bottom"><span class="phd-note">Source: Ministry of Food Processing Industries, Government of India · NIC. Official dashboard data only.</span><a class="phd-btn" href="/pmfme-gujarat-dashboard.html">View Full Gujarat Dashboard →</a></div></div>`}).catch(()=>{document.getElementById('phd-content').innerHTML='<div class="phd-panel"><b>Dashboard data is temporarily unavailable.</b> Please refresh the page.</div>'})})();
</script>
</section>
