name: Sync PMFME Gujarat Dashboard

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Fetch official Gujarat dashboard
        run: node scripts/sync-pmfme-dashboard.js

      - name: Commit updated dashboard data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pmfme-gujarat-dashboard.json
          if git diff --cached --quiet; then
            echo 'No dashboard data change.'
          else
            git commit -m 'Sync PMFME Gujarat dashboard data'
            git push
          fi
