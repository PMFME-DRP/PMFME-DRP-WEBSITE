name: Activate PMFME Gujarat Secondary Domain

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  switch-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch site URLs to pmfmegujarat.info
        shell: bash
        run: |
          set -e
          OLD='https://www.pmfmegujarat.in'
          NEW='https://www.pmfmegujarat.info'
          find . -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.json' \) -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            sed -i "s#${OLD}#${NEW}#g; s#https://pmfmegujarat.in#https://pmfmegujarat.info#g; s#www.pmfmegujarat.in#www.pmfmegujarat.info#g" "$file"
          done
          printf '%s\n' 'www.pmfmegujarat.info' > CNAME

      - name: Commit secondary-domain activation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No domain changes required.'
            exit 0
          fi
          git commit -m 'Activate pmfmegujarat.info as temporary domain [skip ci]'
          git push
